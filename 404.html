<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page introuvable | Cheikh Mbaye</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #0A0A0F;
            --accent: #6EE7B7;
            --accent2: #818CF8;
            --accent3: #F472B6;
            --text: #E2E8F0;
            --text-dim: #94A3B8;
            --card: #16161f;
            --border: rgba(255, 255, 255, 0.07);
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 60% at 80% 20%, rgba(110, 231, 183, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 20% 80%, rgba(129, 140, 248, 0.07) 0%, transparent 60%);
            z-index: 0;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* 404 number */
        .error-number {
            font-family: var(--font-display);
            font-size: clamp(8rem, 20vw, 16rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: float 3s ease-in-out infinite;
            position: relative;
        }

        .error-number::after {
            content: '404';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(40px);
            opacity: 0.3;
            z-index: -1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Icon */
        .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.3);
            }

            50% {
                box-shadow: 0 0 0 16px rgba(110, 231, 183, 0);
            }
        }

        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .error-desc {
            font-size: 1rem;
            color: var(--text-dim);
            max-width: 400px;
            line-height: 1.7;
        }

        /* Buttons */
        .error-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: var(--primary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(110, 231, 183, 0.3);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--text);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 14px 28px;
            border-radius: 50px;
            border: 1px solid var(--border);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, transform 0.2s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Logo */
        .logo {
            position: fixed;
            top: 30px;
            left: 40px;
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--accent);
        }

        /* Countdown */
        .countdown {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .countdown span {
            color: var(--accent);
            font-weight: 700;
            font-family: var(--font-display);
        }
    </style>
</head>

<body>
    <div class="bg"></div>

    <a href="index.html" class="logo">C<span>.</span>M</a>

    <div class="content">
        <div class="error-number">404</div>

        <div class="error-icon">
            <i class="ri-search-line"></i>
        </div>

        <h1 class="error-title">Page introuvable</h1>

        <p class="error-desc">
            Oups ! La page que tu cherches n'existe pas ou a été déplacée.
            Retourne sur la page d'accueil pour continuer.
        </p>

        <div class="error-actions">
            <a href="index.html" class="btn-home">
                <i class="ri-home-line"></i>
                Retour à l'accueil
            </a>
            <button class="btn-back" onclick="history.back()">
                <i class="ri-arrow-left-line"></i>
                Page précédente
            </button>
        </div>

        <p class="countdown">
            Redirection automatique dans <span id="timer">10</span> secondes...
        </p>
    </div>

    <script>
        // Countdown et redirection automatique
        let seconds = 10;
        const timerEl = document.getElementById('timer');

        const countdown = setInterval(() => {
            seconds--;
            timerEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>

</html>
```
